name: Build and Release Sodium

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        description: Target platform
        options:
          - both
          - fabric
          - neoforge
        default: both
      release-type:
        type: choice
        description: Release type
        options:
          - nightly
          - alpha
          - beta
          - stable
        default: nightly

env:
  GRADLE_BUILD_COMMAND: build
  MINECRAFT_VERSION: 26.3
  MOD_VERSION: 0.9.3-alpha.1

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      # multiloader-base.gradle.kts sets JavaLanguageVersion.of(25) and options.release = 25
      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve build inputs
        id: inputs
        shell: bash
        run: |
          # workflow_dispatch inputs are empty on push events; fall back to the repo default
          platform="${{ inputs.platform }}"
          if [[ -z "$platform" ]]; then platform="both"; fi

          release_type="${{ inputs.release-type }}"
          if [[ -z "$release_type" ]]; then
            if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then release_type="nightly"; else release_type="nightly"; fi
          fi

          echo "platform=${platform}" >> "$GITHUB_OUTPUT"
          echo "release_type=${release_type}" >> "$GITHUB_OUTPUT"

      # The root 'build' task writes the final mod jars into build/mods/ (see README).
      - name: Build (Fabric)
        if: steps.inputs.outputs.platform == 'both' || steps.inputs.outputs.platform == 'fabric'
        run: |
          ./gradlew :fabric:build \
            "$GRADLE_BUILD_COMMAND" \
            -Pbuild.release=false

      - name: Build (NeoForge)
        if: steps.inputs.outputs.platform == 'both' || steps.inputs.outputs.platform == 'neoforge'
        run: |
          ./gradlew :neoforge:build \
            "$GRADLE_BUILD_COMMAND" \
            -Pbuild.release=false

      - name: Collect JARs
        id: collect
        shell: bash
        run: |
          mkdir -p dist
          shopt -s nullglob
          jars=(build/mods/*.jar)
          if [[ ${#jars[@]} -eq 0 ]]; then
            echo "::error::No JARs produced in build/mods"
            ls -la build/mods || true
            exit 1
          fi
          for j in "${jars[@]}"; do
            [[ "$j" == *-sources.jar ]] && continue
            cp "$j" "dist/$(basename "$j")"
          done
          shopt -u nullglob
          ls -la dist
          echo "### Built artifacts" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -1 dist >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sodium-jars
          path: dist/*.jar
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sodium-${{ github.sha }}
          name: Sodium ${{ env.MOD_VERSION }}
          body: |
            ## Sodium ${{ env.MOD_VERSION }}

            | | |
            |---|---|
            | Minecraft | ${{ env.MINECRAFT_VERSION }} |
            | Release type | ${{ steps.inputs.outputs.release_type }} |
            | Commit | `${{ github.sha }}` |

            Position is packed into a single 32-bit attribute (X|Y|Z), reducing the
            per-vertex stride from 20 to 16 bytes. Colour, texture and light attributes
            are unchanged. Precision is selectable in-game under
            Video Settings -> Performance -> Terrain Position Precision.
          files: dist/*.jar
          draft: false
          prerelease: ${{ steps.inputs.outputs.release_type != 'stable' }}
          fail_on_unmatched_files: true
