name: Build and Release Sodium

on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        description: Target platform
        options:
          - both
          - fabric
          - neoforge
        default: both
      release-type:
        type: choice
        description: Release type (determines versioning)
        options:
          - nightly
          - alpha
          - beta
          - stable
        default: nightly

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed for GitHub Releases
      packages: read  # needed for Modrinth/CurseForge if needed

    steps:
      - name: Extract current branch name
        shell: bash
        run: |
          ref="${GITHUB_REF#refs/heads/}"
          echo "branch=${ref////-}" >> $GITHUB_OUTPUT
          echo "ref=$ref" >> $GITHUB_OUTPUT
        id: ref

      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false
          cache-dir: ~/.gradle/cache

      - name: Execute Gradle build (Fabric)
        if: inputs.platform == 'both' || inputs.platform == 'fabric'
        run: ./gradlew :fabric:build -Pbuild.release=false

      - name: Execute Gradle build (NeoForge)
        if: inputs.platform == 'both' || inputs.platform == 'neoforge'
        run: ./gradlew :neoforge:build -Pbuild.release=false

      - name: Assemble Fabric JAR
        if: inputs.platform == 'both' || inputs.platform == 'fabric'
        run: |
          mkdir -p fabric-artifacts
          # Find the built jar from the fabric build
          FABRIC_JAR=$(find . -name "*.jar" -path "*/fabric/*" -not -name "*-api*" -not -name "*-sources*" | head -1)
          if [ -n "$FABRIC_JAR" ]; then
            cp "$FABRIC_JAR" fabric-artifacts/sodium-fabric.jar
            echo "fabric_jar_path=fabric-artifacts/sodium-fabric.jar" >> $GITHUB_OUTPUT
          else
            echo "No Fabric JAR found, checking common build..."
            # Try common build
            FABRIC_JAR=$(find . -name "sodium-fabric-*.jar" ! -path "*/.*" 2>/dev/null | head -1)
            if [ -n "$FABRIC_JAR" ]; then
              cp "$FABRIC_JAR" fabric-artifacts/sodium-fabric.jar
              echo "fabric_jar_path=fabric-artifacts/sodium-fabric.jar" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Assemble NeoForge JAR
        if: inputs.platform == 'both' || inputs.platform == 'neoforge'
        run: |
          mkdir -p neoforge-artifacts
          # Find the built jar from the neoforge build
          NEO_FORGE_JAR=$(find . -name "*.jar" -path "*/neoforge/*" -not -name "*-api*" -not -name "*-sources*" 2>/dev/null | head -1)
          if [ -n "$NEO_FORGE_JAR" ]; then
            cp "$NEO_FORGE_JAR" neoforge-artifacts/sodium-neoforge.jar
            echo "neoforge_jar_path=neoforge-artifacts/sodium-neoforge.jar" >> $GITHUB_OUTPUT
          else
            echo "No NeoForge JAR found, checking common build..."
            # Try common build
            NEO_FORGE_JAR=$(find . -name "sodium-neoforge-*.jar" ! -path "*/.*" 2>/dev/null | head -1)
            if [ -n "$NEO_FORGE_JAR" ]; then
              cp "$NEO_FORGE_JAR" neoforge-artifacts/sodium-neoforge.jar
              echo "neoforge_jar_path=neoforge-artifacts/sodium-neoforge.jar" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Upload Fabric artifact
        if: inputs.platform == 'both' || inputs.platform == 'fabric'
        uses: actions/upload-artifact@v7
        with:
          name: sodium-fabric-${{ steps.ref.outputs.branch }}
          path: fabric-artifacts/sodium-fabric.jar

      - name: Upload NeoForge artifact
        if: inputs.platform == 'both' || inputs.platform == 'neoforge'
        uses: actions/upload-artifact@v7
        with:
          name: sodium-neoforge-${{ steps.ref.outputs.branch }}
          path: neoforge-artifacts/sodium-neoforge.jar

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sodium-${{ github.sha }}
          name: "Sodium ${{ github.sha.substring(0, 7) }} Release"
          body: |
            ## Sodium Mod Build

            Automated build of the Sodium mod for Minecraft ${build.config.minecraft_version}.

            ### Available Artifacts

            - **Fabric**: [sodium-fabric.jar](https://github.com/CaffeineMC/sodium/releases/download/sodium-${{ github.sha }}/sodium-fabric.jar)
            - **NeoForge**: [sodium-neoforge.jar](https://github.com/CaffeineMC/sodium/releases/download/sodium-${{ github.sha }}/sodium-neoforge.jar)

            ### Build Information

            - **Minecraft Version**: 26.3
            - **Mod Version**: 0.9.3-alpha.1
            - **Platform**: ${{ inputs.platform == 'both' && 'Fabric & NeoForge' || inputs.platform == 'fabric' && 'Fabric' || 'NeoForge' }}
            - **Build Date**: ${{ github.run_date }}
            - **Commit**: ${{ github.sha }}

          draft: false
          prerelease: ${{ inputs.release-type != 'stable' }}

      - name: Set release version
        if: github.ref == 'refs/heads/main'
        run: |
          # Determine version based on release type
          if [[ "${{ inputs.release-type }}" == "stable" ]]; then
            echo "version=stable" >> $GITHUB_ENV
          elif [[ "${{ inputs.release-type }}" == "beta" ]]; then
            echo "version=beta" >> $GITHUB_ENV
          else
            echo "version=nightly" >> $GITHUB_ENV
          fi

      - name: Upload Release Assets
        if: github.ref == 'refs/heads/main' && env.version == 'stable'
        uses: actions/upload-artifact@v7
        with:
          name: sodium-release-${{ steps.ref.outputs.branch }}
          path: |
            fabric-artifacts/sodium-fabric.jar
            neoforge-artifacts/sodium-neoforge.jar