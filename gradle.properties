# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.caching=true
org.gradle.parallel=true

# ---------------------------------------------------------------------------
# Chunk vertex position compression profile.
#
#   original : 5/9/5  - one stored step per block on X/Z (largest saving, visible position snapping)
#   ideal    : 9/9/9  - one sixteenth of a block per step (vanilla parity, same 4-byte saving)
#
# Override per build with:  ./gradlew build -Pvertex.bits=ideal
# ---------------------------------------------------------------------------
vertex.bits=original
